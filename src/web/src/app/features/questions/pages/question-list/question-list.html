<div class="container py-4">
  <button type="button" class="btn btn-success mb-3" routerLink="/questions/new">
    Add Question
  </button>

  @if (isLoading()) {
    <div class="alert alert-info">Loading questions...</div>
  }

  @if (errorMessage()) {
    <div class="alert alert-danger">
      {{ errorMessage() }}
    </div>
  }

  @for (question of questions(); track question.id; let index = $index) {
    <div class="card mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between mb-2">
          <h1 class="h5">{{ index + 1 }}. {{ question.questionText }}</h1>

          <button
            type="button"
            class="btn btn-danger btn-sm"
            [disabled]="deletingQuestionId() === question.id"
            (click)="deleteQuestion(question.id)"
          >
            {{ deletingQuestionId() === question.id ? 'Deleting...' : 'Delete' }}
          </button>
        </div>

        @for (choice of question.choices; track choice.id) {
          <div class="form-check">
            <input type="radio" class="form-check-input" [name]="'question-' + question.id" />

            <label class="form-check-label">
              {{ choice.choiceText }}
            </label>
          </div>
        }
      </div>
    </div>
  }
</div>
